<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ArchViz Explorer</title>
  <!-- Preload do poster e do primeiro vídeo -->
  <link rel="preload" href="images/seq/aereo_to_piscina_00.jpg" as="image" />
  <link rel="preload" href="images/1.webm" as="video" type="video/webm" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="cursor"></div>
  <div id="ring"></div>
  <div id="noise"></div>

  <div id="stage">
    <video id="main-video" muted loop playsinline preload="auto"></video>
    <canvas id="seq-canvas"></canvas>
    <div id="poi-layer"></div>
  </div>

  <div id="scene-tag"></div>
  <div id="track"></div>

  <div id="loader"><span></span><span></span><span></span></div>

  <div id="debug-hud" hidden>
    <span id="debug-mode">DEBUG ON — clique para coordenadas</span>
    <span id="debug-coords">—</span>
  </div>

  <script src="scenes.js"></script>
  <script src="script.js"></script>
</body>
</html>
