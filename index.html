<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Maquete interativa</title>
    <!-- Preload do poster e do primeiro vídeo -->
    <link
      rel="preload"
      href="images/seq_arch/aereo_to_piscina_00.jpg"
      as="image"
    />
    <link rel="preload" href="images/1.webm" as="video" type="video/webm" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      #btn-back {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: 20px;
        z-index: 50;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.10);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: rgba(255,255,255,0.85);
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s, transform 0.2s;
      }
      #btn-back:hover {
        background: rgba(255,255,255,0.18);
        border-color: rgba(255,255,255,0.35);
        transform: translateX(-2px);
      }
      #btn-back svg {
        flex-shrink: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <a id="btn-back" href="fi-preview.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      Voltar
    </a>

    <div id="cursor"></div>
    <div id="ring"></div>
    <div id="noise"></div>

    <div id="stage">
      <video id="main-video" muted loop playsinline preload="auto"></video>
      <canvas id="seq-canvas"></canvas>
      <div id="poi-layer"></div>
    </div>

    <div id="scene-tag"></div>
    <div id="track"></div>

    <div id="loader"><span></span><span></span><span></span></div>

    <div id="debug-hud" hidden>
      <span id="debug-mode">DEBUG ON — clique para coordenadas</span>
      <span id="debug-coords">—</span>
    </div>

    <script src="scenes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
