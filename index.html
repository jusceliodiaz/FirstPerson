    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" /></noscript>

  </head>
  <body>
    <div id="cursor"></div>
    <div id="ring"></div>
    <div id="noise"></div>

    <div id="stage">
      <video id="main-video" muted loop playsinline preload="auto"></video>
      <canvas id="seq-canvas"></canvas>
      <div id="poi-layer"></div>
    </div>

    <div id="scene-tag"></div>
    <div id="track"></div>

    <div id="loader"><span></span><span></span><span></span></div>

    <div id="debug-hud" hidden>
      <span id="debug-mode">DEBUG ON — click for coordinates</span>
      <span id="debug-coords">—</span>
    </div>

    <!-- AI dock -->
    <div id="ai-dock">
      <div id="ai-trigger-btn" onclick="aiTogglePanel()" tabindex="-1">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/>
          <circle cx="9" cy="14" r="1" fill="#111" stroke="none"/>
          <circle cx="15" cy="14" r="1" fill="#111" stroke="none"/>
          <path d="M9 18h6"/>
        </svg>
        <span>IA</span>
      </div>
      <div id="ai-voice-btn" onclick="neoLiveToggle()" tabindex="-1" title="Talk to the AI">
        <span id="ai-voice-pulse-ring"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </div>
    </div>

    <!-- AI PANEL -->
    <div id="ai-panel">
      <div id="ai-panel-header">
        <div id="ai-panel-title">AI Studio</div>
        <div id="ai-panel-close" onclick="aiTogglePanel()" tabindex="-1">
          <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
        </div>
      </div>
      <div id="ai-tabbar">
        <button class="ai-tab-btn active" data-tab="image" onclick="aiSwitchTab('image')">🖼️ Image</button>
        <button class="ai-tab-btn" data-tab="video" onclick="aiSwitchTab('video')">🎬 Video</button>
      </div>
      <div id="ai-panel-body">
        <div class="ai-field" id="ai-key-field">
          <label class="ai-lbl">API Key</label>
          <input type="password" id="ai-key" placeholder="Enter API Key" autocomplete="off" spellcheck="false" />
        </div>

        <!-- TAB: IMAGE -->
        <div class="ai-tab-panel active" id="ai-tab-image">
          <div class="ai-tab-col">
            <div class="ai-field">
              <label class="ai-lbl" style="display:flex;align-items:center;gap:6px">
                <span>Style instruction</span>
                <span style="font-size:9px;letter-spacing:0.06em;color:rgba(0,0,0,0.4);font-weight:500;text-transform:none">• uses current view as reference</span>
              </label>
              <textarea id="ai-img-prompt" placeholder="Optional if you captured the view — e.g. golden hour lighting, luxury real estate..."></textarea>
            </div>
            <div class="ai-capture-row">
              <button class="ai-capture-btn" onclick="aiManualCapture()">📷 Capture View</button>
              <div class="ai-capture-thumb" id="ai-img-capture-thumb">No capture</div>
            </div>
            <button class="ai-generate-btn" id="ai-img-generate-btn" onclick="aiGenerate()">Generate Image</button>
            <div class="ai-status" id="ai-img-status"></div>
          </div>
          <div class="ai-tab-col">
            <div id="ai-img-wrap">
              <img id="ai-result-img" alt="" onclick="aiOpenLightbox()" title="Click to enlarge" />
              <div id="ai-img-zoom-hint">🔍</div>
              <button class="ai-result-close" onclick="aiCloseImage()" title="Close">
                <svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
              </button>
            </div>
            <div class="ai-result-placeholder" id="ai-img-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="9" cy="9" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </div>
            <button class="ai-dl-btn" id="ai-img-dl-btn" onclick="aiDownload()">Download Image</button>
          </div>
        </div>

        <!-- TAB: VIDEO -->
        <div class="ai-tab-panel" id="ai-tab-video">
          <div class="ai-tab-col">
            <div class="ai-field">
              <label class="ai-lbl" style="display:flex;align-items:center;gap:6px">
                <span>Describe the video scene</span>
                <span style="font-size:9px;letter-spacing:0.06em;color:rgba(0,0,0,0.4);font-weight:500;text-transform:none">• Veo 3.1</span>
              </label>
              <textarea id="ai-vid-prompt" placeholder="Cinematic drone shot slowly pushing forward over the pool at golden hour..."></textarea>
            </div>
            <div class="ai-lbl">Animate from</div>
            <div class="ai-row">
              <button class="ai-capture-btn" data-src="capture" onclick="aiSetVideoSource('capture')">📷 Current View</button>
              <button class="ai-capture-btn" data-src="generated" onclick="aiSetVideoSource('generated')">🖼️ Generated Image</button>
            </div>
            <div class="ai-capture-thumb" id="ai-vid-capture-thumb">No image — text-only video</div>
            <button class="ai-generate-btn" id="ai-vid-generate-btn" onclick="aiGenerateVideo()">Generate Video</button>
            <div class="ai-status" id="ai-vid-status">Video generation takes 1 to 3 minutes.</div>
          </div>
          <div class="ai-tab-col">
            <div id="ai-vid-wrap">
              <video id="ai-result-video" controls playsinline></video>
              <button class="ai-result-close" onclick="aiCloseVideo()" title="Close">
                <svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
              </button>
            </div>
            <div class="ai-result-placeholder" id="ai-vid-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="5" width="14" height="14" rx="2"/>
                <path d="M16.5 10l5-3v10l-5-3"/>
              </svg>
            </div>
            <button class="ai-dl-btn" id="ai-vid-dl-btn" onclick="aiDownloadVideo()">Download Video</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lightbox — enlarge generated image -->
    <div id="ai-lightbox" onclick="aiCloseLightbox()">
      <button id="ai-lightbox-close" onclick="aiCloseLightbox()" title="Close">
        <svg viewBox="0 0 14 14"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>
      </button>
      <img id="ai-lightbox-img" alt="" />
    </div>

    <script src="scenes-fp.js"></script>
    <script src="script-fp.js"></script>
  </body>
</html>
